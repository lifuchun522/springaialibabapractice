# 机密配置模板：**这个文件不进版本库**（.gitignore 已忽略 *secret*.yaml 的真实文件）。
#
# 用法：
#   kubectl -n digital-human create secret generic saa-agent-secret \
#     --from-literal=DEEPSEEK_API_KEY=sk-xxxx \
#     --from-literal=DIGITAL_HUMAN_DB_PASSWORD=xxxx
#
# 为什么不把值写进这个模板文件：与第 16 掌「配置外置的终点是配置有唯一来源」同一条道理——
# 模板可以进版本库，值不行。云上更推荐走 External Secrets / Secrets Manager，
# 让凭据根本不经过 kubectl 命令行（命令行会进 shell 历史与审计日志）。
apiVersion: v1
kind: Secret
metadata:
  name: saa-agent-secret
  namespace: digital-human
type: Opaque
stringData:
  # 部署契约里的必需项：缺了进程会在启动期失败并点名这两个变量（见 DeploymentContract）
  DEEPSEEK_API_KEY: "REPLACE_ME"
  DIGITAL_HUMAN_DB_PASSWORD: "REPLACE_ME"
