# 部署编排：MCP Server + 数字人应用。
# 由 CI 同步到服务器 $DEPLOY_DIR 后执行 `docker compose up -d`；
# 变量全部来自同目录下的 .env（CI 生成，见 deploy/deploy-remote.sh）。
#
# 数据库默认不在这里管：生产一般已有 MySQL。若要在本机一起起一个，用
#   docker compose --profile with-db up -d
# 并让 APP_DB_URL / APP_MCP_DB_URL 指向 mysql 服务。

services:
  digital-human-mcp:
    image: ${APP_MCP_IMAGE}:${VERSION:-latest}
    container_name: digital-human-mcp
    restart: unless-stopped
    # 数据库跑在宿主机时（本仓库默认形态），容器需要这个映射才能解析 host.docker.internal；
    # Linux 上 Docker 不会自动提供它——这一条是部署时实测踩出来的。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      MCP_DB_URL: ${APP_MCP_DB_URL}
      MCP_DB_USER: ${APP_MCP_DB_USER}
      MCP_DB_PASSWORD: ${APP_MCP_DB_PASSWORD}
    ports:
      - "${MCP_PORT:-8081}:8081"
    # 基础镜像默认是 alpine（自带 busybox wget）；若换成非 alpine 基础镜像，
    # 请把下面两条健康检查改成 curl，或在镜像里装上 wget。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  digital-human:
    image: ${APP_DIGITAL_HUMAN_IMAGE}:${VERSION:-latest}
    container_name: digital-human
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      digital-human-mcp:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 数据源
      # `${VAR:?提示}` 是第 16 掌补的「部署契约」：变量没设时 compose 直接拒绝启动并打印提示，
      # 而不是把这个缺失带进容器、变成启动后第一次请求的一个 401。
      # 只给「没有安全默认值」的项加这个约束；端口、模型名这类有默认值的项保持可省。
      DIGITAL_HUMAN_DB_URL: ${APP_DB_URL:?缺少 APP_DB_URL：数据库地址必须由部署环境声明（deploy/.env 或 K8s ConfigMap）}
      DIGITAL_HUMAN_DB_USER: ${APP_DB_USER:?缺少 APP_DB_USER}
      DIGITAL_HUMAN_DB_PASSWORD: ${APP_DB_PASSWORD:?缺少 APP_DB_PASSWORD}
      # 模型密钥：只从环境变量进来，不进镜像、不进仓库
      DEEPSEEK_API_KEY: ${APP_DEEPSEEK_API_KEY:?缺少 APP_DEEPSEEK_API_KEY：模型密钥只能由部署环境注入，禁止写默认值}
      # 容器内直连 MCP Server 的服务名，不用走宿主机端口
      MCP_SERVER_URL: http://digital-human-mcp:8081
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      # 探 readiness 而不是根 health：根 health 只说明「进程活着 + 依赖没挂」，
      # readiness 里含 configReadiness，能区分「起来了」和「配置齐了、可以接流量」。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 可选的本地数据库（生产通常已有 MySQL，故默认不启用）
  mysql:
    image: mysql:8.0
    container_name: digital-human-mysql
    profiles: ["with-db"]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${APP_DB_PASSWORD}
      MYSQL_DATABASE: digital_human
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "3306:3306"

volumes:
  mysql-data:
