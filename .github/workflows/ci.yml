name: CI

# 每一次提交都要过同一道门：编译 + 单测 + 基线门禁（JDK/Maven/依赖收敛）与架构图一致性。
# 这里不需要任何密钥——测试用内存库、MCP 客户端在 test profile 下关闭。

on:
  push:
    branches: [main, 'chapter/**']
  pull_request:
    branches: [main]

# 第 08 保：最小权限。CI 只读仓库内容，不需要写权限。
# 显式声明之后，job 内的 GITHUB_TOKEN 即使被误用也无法改仓库状态——
# 「人记得住规则，但人守不住规则」，所以把权限交给声明而不是交给自觉。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw 的 Maven 发行版本身要联网下载，实测在 runner 上偶发失败
      # （wget: Failed to fetch apache-maven-3.9.11-bin.zip）——这不是代码问题，却是红灯。
      # 缓存下来，顺便把「下载失败」与「测试失败」两类红灯分开。
      - name: 缓存 Maven Wrapper 的 Maven 发行版
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-3.9.11

      - name: 编译与测试（两个模块）
        # 优先用仓库自带的 mvnw（Maven 版本钉在仓库里）；
        # 只有 wrapper 自己下载失败时才退回 runner 预装的 Maven——
        # 退回不代表放松基线：enforcer 的 requireMavenVersion [3.9,) 照样会拦住低版本。
        run: |
          if ./mvnw -v >/dev/null 2>&1; then
            MVN=./mvnw
          else
            echo "::warning::mvnw 无法引导 Maven（多为下载失败），本次退回 runner 预装的 Maven（仍受 enforcer 版本下限约束）"
            MVN=mvn
          fi
          echo "使用：$($MVN -v | head -1)"
          $MVN -B -ntp clean verify

      - name: 架构图一致性门禁
        # 起因是一次真实偏差：README 的架构图里少画了 5 个组件
        # （livekit-agent / livekit-server / tts / asr / nacos），而当时没有任何检查会发现它——
        # 图是散文，散文不会失败。这道门禁只依赖 Python 标准库，
        # 检查：必需组件是否在图上、中英两份图是否漂移、预留组件是否同时记在非交付清单里。
        run: python3 scripts/check-diagrams.py

      - name: 治理索引死链门禁（第 07/14 保）
        # 同一类问题的第二个实例：docs/github-ops/README.md 是十三保索引，
        # 文件名一改就会出现死链，而死链不会让任何东西失败——只会在读者点进去时才发现。
        # 只依赖 Python 标准库，不联网、不鉴权，因此不会因外部抖动红灯。
        run: python3 scripts/check-github-ops-links.py

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

      - name: 钉钉通知（失败时）
        # 不能在 if 里引用 secrets：那会让整个 workflow 校验失败（整个 run 连 job 都建不出来）。
        # 未配置时由 notify-dingtalk.sh 自己跳过。
        if: failure()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          TITLE: 'CI 失败'
          TEXT: |
            **仓库**：${{ github.repository }}
            **分支**：${{ github.ref_name }}
            **提交**：${{ github.sha }}
            **触发**：${{ github.actor }}
            **详情**：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash deploy/notify-dingtalk.sh
