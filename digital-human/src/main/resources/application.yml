server:
  port: 8080

spring:
  application:
    name: digital-human
  datasource:
    # 本地 MySQL 8：docker run -d --name dh-mysql -e MYSQL_ROOT_PASSWORD=root \
    #   -e MYSQL_DATABASE=digital_human -p 3306:3306 mysql:8
    url: ${DIGITAL_HUMAN_DB_URL:jdbc:mysql://127.0.0.1:3306/digital_human?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DIGITAL_HUMAN_DB_USER:root}
    password: ${DIGITAL_HUMAN_DB_PASSWORD:root}
  jpa:
    # 表结构由 Flyway 建，Hibernate 只做校验：谁能改表结构必须唯一
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    # MCP Client：远程消费展厅预约 Server 的工具。
    # 端点约定必须和 Server 的 protocol 对齐（STREAMABLE ↔ streamable-http），
    # 配错不会报「协议不匹配」，只会得到 404，然后被静默当成「没有工具」。
    mcp:
      client:
        enabled: true
        name: digital-human
        version: 1.0.0
        type: SYNC
        streamable-http:
          connections:
            showroom:
              url: ${MCP_SERVER_URL:http://localhost:8081}
              endpoint: /mcp
    model:
      # 本项目只提供一条模型通道：DeepSeek（OpenAI 兼容协议）。
      # 系列基线是 DashScope，等需要它的章节（第 3 掌语音、第 8 掌 Embedding）再按章引入，
      # 现在不留「引了但不用」的通道——不用它，就不该在启动期向它要密钥。
      chat: openai
      # 本掌只用到对话能力，其余模态显式关闭
      embedding: none
      image: none
      video: none
      rerank: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      # 密钥只从环境变量注入，禁止写进仓库
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          # 模型名收敛为配置项，便于切换与启动期校验
          model: ${DEEPSEEK_MODEL:deepseek-flash}

digital-human:
  chat:
    # 新建项目时写入 agent_config 的默认人设；运营可在项目里改，改完刷新运行页即生效
    default-system: 你是一个专业的数字人主播，回答简洁友好。
  rag:
    # 检索候选池与展示条数必须分开：topK 是「候选池要多大」（宁宽勿窄），展示才是「给模型看几条」。
    # 把 topK 当结果数用，是「一加过滤就一条都查不到」的常见根因。
    retrieval-budget: 20
    display-count: 4
    # 0 表示不设向量库阈值：中文短问句与长 chunk 的余弦相似度普遍不高，阈值是「突然答不出来」的头号嫌疑
    similarity-threshold: 0.0
    # 业务侧的「有没有依据」下限：低于它就不算依据，直接拒答（判相关性，不判隔离）
    min-score: 0.01
    # 提示词属于配置：改措辞不该改代码
    system-prompt: |
      你只能依据 <context> 中提供的资料回答。
      回答里必须用 [序号] 标注依据来自哪一条资料。
      如果资料里没有答案，直接回答「资料里没有相关内容」，不要补充你自己的知识。
  memory:
    # 模型短期看多少条消息（投影，可丢可重建）；产品历史另有 chat_message 账本
    max-messages: 20
  tools:
    # 工具执行时间上限：下游卡住不能把整个对话线程拖死
    timeout-ms: 3000
    pool-size: 4
    # 工具失败后的重试次数（总尝试次数 = 该值 + 1）。
    # 超时不算失败、不重试：重试只会把等待时间翻倍，等的人还是同一个用户。
    max-retries: 2
  agent:
    # 单次用户请求的模型调用硬上界：超限显式结束（END），不是超时
    model-call-limit: 8
    instruction: |
      你是数字人助手。需要事实时优先调用工具或知识库检索，不要凭记忆编造。
      回答简短、口语化，不要输出 Markdown 表格。
  mcp:
    # 远程工具发现：清单为空时是否直接启动失败。
    # 默认开着：Server 没起来时「工具静默为空」比启动失败更难查——
    # 前者表现为模型忽然不会查预约了，后者在启动日志里就写着原因。
    fail-fast: true
  # 编排层（第 10 掌）：谁在什么条件下跑写在这里，内容怎么生成写在节点提示词里
  # （节点提示词的默认值在 WorkflowProperties 里，这里只放边界旋钮，避免两处措辞漂移）
  workflow:
    # 补信息循环的最大轮数：缺信息要追问，但不能无限追问
    loop-max-rounds: 2
    # 路由分类的温度。分类结果会被代码当条件用，不能有采样自由度：
    # 实测同一批 20 组样本连续跑三次，命中 17 / 16 / 16（一条「预约余位」的问题翻过面）
    route-temperature: 0
  # 售后状态图（第 11 掌）：流程结构在边里，状态归约在策略里，人机边界是一个节点
  after-sale:
    # 金额阈值与「需要人工确认的意图」都是业务规则：写在配置里，不写在提示词里
    risk-amount-threshold: 500
    human-review-intents:
      - REFUND
      - REPAIR
  # 多 Agent（第 12 掌）：三个角色各带自己的提示词、工具与记忆
  multi-agent:
    # 一跳最多换几个角色：上界由代码握着，不指望模型自己停
    max-hops: 3
  # 跨服务协作（第 13 掌）：只依赖协议，不依赖对端任何类
  a2a:
    # 静态实例表（逗号分隔）。写法说明：用 @Value 绑 List 时 YAML 列表不会自动展开，
    # 只会得到一个元素——实测多实例验证时就是这个原因导致「总是只打第一个实例」。
    # 多实例/扩缩容场景应改走下面的 Nacos 发现。
    instances: http://127.0.0.1:8082,http://127.0.0.1:8083
    nacos:
      # 打开方式：把 enabled 改成 true 并填好 server-addr。
      # 本环境没有起 Nacos，所以用上面的静态实例表验证「多实例分散调用」；
      # 两条路径走同一个 AgentRegistry 接口，主服务的调用逻辑不变。
      enabled: false
      server-addr: 127.0.0.1:8848
      service-name: knowledge-agent
    # 单次跨服务调用超时；超时是「明确失败」，不是静默返回兜底答案
    timeout-ms: 15000
    # 只对「对方可能没收到」的失败重试；4xx 不重试
    max-attempts: 2
    protocol-version: '1.0'
  # 模型目录：有哪些 provider、每个 provider 下有哪些模型，全部是配置。
  # agent_config.provider / model 必须命中这里，否则改配置时直接 400、启动期也不会带病运行。
  models:
    - id: deepseek-flash
      provider: deepseek
      display-name: DeepSeek V4.1 Flash
      description: 默认模型，速度快、成本低，适合数字人日常对话
    - id: deepseek-v4-pro
      provider: deepseek
      display-name: DeepSeek V4 Pro
      description: 复杂推理与长文档场景，成本更高

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 第 16 掌：探针要能区分「进程活着」和「关键配置齐了」。
      # 不显示细节时，运维看到的只是一个 UP/DOWN，排查还得登机器看日志。
      show-details: always
      probes:
        enabled: true
      group:
        # liveness：只问「进程还在不在」。它绝不能包含配置与数据库——
        # 否则配置一缺、库一抖，K8s 就会把还活着的进程反复杀掉重启，
        # 把「配置问题」放大成「服务雪崩」。
        liveness:
          include: ping
        # readiness：问「现在能不能接流量」。这里包含配置就绪与数据库，
        # 缺任意一项都不该被挂进负载均衡。
        readiness:
          include: configReadiness,db,diskSpace

logging:
  level:
    com.example.digitalhuman: info
