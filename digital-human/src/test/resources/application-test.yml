# 测试 profile：内存库 + Hibernate 建表，保证 `./mvnw test` 离线可跑、结果确定。
# 运行期走 MySQL + Flyway（见 application.yml），两者的差异点写在 docs/ch03-数字人底座.md 里。
spring:
  datasource:
    url: jdbc:h2:mem:digital_human;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
    locations: classpath:db/migration
  # 图检查点表不在 JPA 实体里，Hibernate 不会建；用与 Flyway V6 等价的 H2 版建一次。
  # 这样测试跑的就是**生产同一份 MysqlCheckpointSaver**，而不是换成内存 saver 糊过去。
  sql:
    init:
      mode: always
      schema-locations: classpath:graph-schema.sql
  ai:
    mcp:
      client:
        # 单测不依赖外部 MCP Server：关掉客户端，远程工具集为空
        enabled: false

digital-human:
  chat:
    default-system: 你是一个专业的数字人主播，回答简洁友好。
  mcp:
    # 测试环境没有 MCP Server，因此不 fail-fast；fail-fast 本身的行为由单测覆盖
    fail-fast: false
